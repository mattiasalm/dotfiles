# Starship configuration
# Uses Cousine Nerd Font for optimal display

# General settings
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

# Disable the blank line at the start of the prompt
add_newline = true

# Hostname
[hostname]
disabled = true

# Directory
[directory]
truncation_length = 99
truncate_to_repo = false
home_symbol = " ~"
format = "[$path]($style)[$read_only]($read_only_style) "

# Git branch
[git_branch]
style = "green"

# Git status
[git_status]
format = '[$all_status$ahead_behind]($style) '
style = "green"
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"

# Character
[character]
success_symbol = " [❯](purple)"
error_symbol = " [❯](red)"
vicmd_symbol = " [❮](green)"